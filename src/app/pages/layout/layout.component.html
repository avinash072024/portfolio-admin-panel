<div class="admin-shell" [class.sidebar-open]="isSidebarOpen">
    <app-header (menuToggle)="toggleSidebar()"></app-header>

    <div class="admin-body">
        <button class="sidebar-backdrop" type="button" aria-label="Close navigation" (click)="closeSidebar()"></button>

        <aside class="admin-sidebar" aria-label="Main navigation">
            <div class="sidebar-brand-row">
                <a class="sidebar-brand" routerLink="/home" (click)="closeSidebar()">
                    <span class="brand-mark"><i class="bi bi-grid-1x2-fill"></i></span>
                    <span class="brand-copy">
                        <strong>Admin <span>Panel</span></strong>
                        <small>Portfolio workspace</small>
                    </span>
                </a>
                <button class="sidebar-close-button" type="button" aria-label="Close navigation" (click)="closeSidebar()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <nav class="sidebar-navigation">
                @for (section of navSections; track section.label) {
                    <div class="nav-section">
                        <p class="nav-section-title">{{ section.label }}</p>
                        @for (item of section.links; track item.path) {
                            <a class="sidebar-link"
                                [routerLink]="item.path"
                                routerLinkActive="active"
                                [routerLinkActiveOptions]="{ exact: item.path === '/home' }"
                                (click)="closeSidebar()">
                                <i [class]="item.icon"></i>
                                <span>{{ item.label }}</span>
                                @if (item.path === '/home') {
                                    <span class="sidebar-link-indicator"></span>
                                }
                            </a>
                        }
                    </div>
                }
            </nav>

            <div class="sidebar-bottom">
                <div class="workspace-card">
                    <span class="workspace-icon"><i class="bi bi-stars"></i></span>
                    <div>
                        <strong>Your workspace</strong>
                        <small>All systems ready</small>
                    </div>
                    <span class="workspace-status"></span>
                </div>
            </div>
        </aside>

        <main class="admin-main">
            <div class="page-content">
                <router-outlet></router-outlet>
            </div>
            <app-footer></app-footer>
        </main>
    </div>

    @if (showScrollTop) {
        <button class="scroll-top-button" type="button" aria-label="Scroll to top" title="Scroll to top"
            (click)="scrollToTop()">
            <i class="bi bi-arrow-up"></i>
        </button>
    }
</div>
