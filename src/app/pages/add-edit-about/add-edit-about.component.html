<div class="container py-5 mt-5">
	<div class="card shadow-lg mt-5 border-1 border-primary rounded-4 overflow-hidden" data-aos="fade-up">
		<div class="card-header d-flex justify-content-between align-items-center bg-primary py-3">
			<h4 class="text-white mb-0"><i class="bi me-2" [ngClass]="type === 'education' ? 'bi-mortarboard' : 'bi-briefcase'"></i>{{ heading }}</h4>
			<a routerLink="/about" class="btn btn-primary fw-bold"><i class="bi bi-arrow-left"></i> Back</a>
		</div>

		@if (form) {
		<div class="card-body p-4 p-md-5">
			<form [formGroup]="form" (ngSubmit)="save()">
				<div class="row g-4">
					<div class="col-md-6 col-lg-4">
						<label class="form-label fw-bold" for="about-title">{{ type === 'education' ? 'Education Title' : 'Job Title' }}</label>
						<input id="about-title" class="form-control" formControlName="title" [class.is-invalid]="isInvalid('title')"
							[placeholder]="type === 'education' ? 'e.g. B.Sc. Computer Science' : 'e.g. Frontend Developer'" appCapitalize="space">
						<div class="invalid-feedback">Title is required.</div>
					</div>
					<div class="col-md-6 col-lg-4">
						<label class="form-label fw-bold" for="about-organization">{{ type === 'education' ? 'Institution' : 'Company' }}</label>
						<input id="about-organization" class="form-control" [formControlName]="type === 'education' ? 'institution' : 'company'"
							[class.is-invalid]="isInvalid(type === 'education' ? 'institution' : 'company')"
							[placeholder]="type === 'education' ? 'University or college' : 'Company name'" appCapitalize="space">
						<div class="invalid-feedback">{{ type === 'education' ? 'Institution' : 'Company' }} is required.</div>
					</div>
					<div class="col-md-6 col-lg-4">
						<label class="form-label fw-bold" for="about-duration">Duration</label>
						<input id="about-duration" class="form-control" formControlName="duration" [class.is-invalid]="isInvalid('duration')"
							[placeholder]="type === 'education' ? '2018 - 2022' : '2022 - Present'" appCapitalize="space">
						<div class="invalid-feedback">Duration is required.</div>
					</div>
					<div class="col-12">
						<label class="form-label fw-bold" for="about-description">Description <span class="text-muted fw-normal">(Optional)</span></label>
						<textarea id="about-description" class="form-control" rows="3" formControlName="description"
							placeholder="Add a short description" appCapitalize="dot-space"></textarea>
					</div>
                    <div class="col-md-6 col-lg-4">
                        <div class="form-check mt-2">
                            <!-- Bound to reactive form control via formControlName -->
                            <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive">
                            <label class="form-check-label fw-bold" for="isActive">
                                Active
                            </label>
                        </div>
                    </div>
				</div>
				<div class="mt-5 d-flex justify-content-center align-items-center gap-2">
					<button type="submit" class="btn btn-primary px-3 rounded-3">{{ isEdit ? 'Update' : 'Save' }}</button>
					<a routerLink="/about" class="btn btn-light px-3 rounded-3 border">Cancel</a>
				</div>
			</form>
		</div>
		}
	</div>
</div>
