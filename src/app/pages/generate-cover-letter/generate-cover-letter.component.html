<div class="container-fluid px-0">
	<div class="card shadow-sm border-1 rounded-4 overflow-hidden" data-aos="fade-up">
		<div class="card-header d-flex justify-content-between align-items-center py-3">
			<h5 class="text-primary mb-0">
				<i class="bi bi-file-earmark-text me-2"></i>Generate Cover Letter
			</h5>
			<!-- <a routerLink="/home" class="btn btn-primary fw-bold">
				<i class="bi bi-arrow-left"></i> Back
			</a> -->
			<button class="btn btn-primary px-3 rounded-3 fw-bold" (click)="location.back()">
				<i class="bi bi-arrow-left"></i> Back</button>
		</div>

		<div class="card-body p-3 p-md-4">
			<form [formGroup]="coverLetterForm" (ngSubmit)="generateCoverLetter()" novalidate autocomplete="off">
				<div class="row g-3">
					<div class="col-md-4">
						<label for="companyName" class="form-label fw-bold">Company Name</label>
						<input id="companyName" type="text" formControlName="companyName" class="form-control"
							[class.is-invalid]="coverLetterForm.controls.companyName.invalid && coverLetterForm.controls.companyName.touched"
							placeholder="e.g. Acme Technologies" aria-describedby="companyNameFeedback">
						<div id="companyNameFeedback" class="invalid-feedback">Enter the company name.</div>
					</div>

					<div class="col-md-4">
						<label for="subject" class="form-label fw-bold">Application Subject</label>
						<input id="subject" type="text" formControlName="subject" class="form-control"
							[class.is-invalid]="coverLetterForm.controls.subject.invalid && coverLetterForm.controls.subject.touched"
							placeholder="e.g. Application for Frontend Developer" aria-describedby="subjectFeedback">
						<div id="subjectFeedback" class="invalid-feedback">Enter the application subject.</div>
					</div>
					<div class="col-md-4">
						<label class="form-label fw-bold text-transparent">&nbsp;</label>
						<div class="d-flex justify-content-center align-items-center gap-2">
							<button type="submit" class="btn btn-primary px-3 rounded-3" [disabled]="isGenerating()">
								@if (isGenerating()) {
								<span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
								Generating PDF...
								} @else {
								<i class="bi bi-file-earmark-pdf me-1" aria-hidden="true"></i>Generate PDF
								}
							</button>
							<!-- <a routerLink="/home" class="btn btn-light px-3 rounded-3 border">Cancel</a> -->
							<button class="btn btn-light px-3 rounded-3 border" type="reset">Reset</button>
						</div>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>
