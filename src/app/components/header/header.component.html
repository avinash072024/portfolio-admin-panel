<header class="admin-header">
    <div class="header-leading">
        <button class="header-icon-button menu-toggle" type="button" aria-label="Toggle navigation"
            (click)="menuToggle.emit()">
            <i class="bi bi-list"></i>
        </button>
        <div class="header-title">
            <div class="header-breadcrumb"><span>{{currentMenu()}}</span><i class="bi bi-chevron-right"></i><strong>{{ currentPage() }}</strong></div>
            <h1>{{ currentPage() }}</h1>
        </div>
    </div>

    <div class="header-actions">
        <app-theme-toggler />
    </div>
</header>
